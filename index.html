<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'dark', language = 'vi';
        try {
          if (localStorage.getItem('aezcheck-theme') === 'light') theme = 'light';
          const storedLanguage = localStorage.getItem('aezcheck-language');
          if (storedLanguage === 'vi' || storedLanguage === 'en') language = storedLanguage;
          else if (storedLanguage) language = 'en';
        } catch {}
        const routeLocale = /^\/(vi|en|ru|th|zh)(?:\/|$)/.exec(location.pathname)?.[1];
        if (routeLocale) language = routeLocale === 'vi' ? 'vi' : 'en';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'light' ? '#f5faf7' : '#07110f';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo-removebg-128.png" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
