<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <!-- Meta Pixel: AezCheck -->
    <script>
      !function(f,b,e,v,n,t,s) {
        if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
        s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s);
      }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1441034438213115');
      (() => {
        let lastPage;
        const trackPageView = () => {
          // Section anchors are not separate pages; legacy hash routes are.
          const route = location.hash.startsWith('#/')
            ? location.hash.split('#')[1]
            : location.pathname;
          const page = route + location.search;
          if (page === lastPage) return;
          lastPage = page;
          fbq('track', 'PageView');
        };
        trackPageView();
        window.addEventListener('popstate', trackPageView);
        window.addEventListener('hashchange', trackPageView);
      })();
    </script>
    <script>
      (() => {
        let theme = 'dark', language = 'vi';
        try {
          if (localStorage.getItem('aezcheck-theme') === 'light') theme = 'light';
          const storedLanguage = localStorage.getItem('aezcheck-language');
          if (storedLanguage === 'vi' || storedLanguage === 'en') language = storedLanguage;
          else if (storedLanguage) language = 'en';
        } catch {}
        const routeLocale = /^\/(vi|en|ru|th|zh)(?:\/|$)/.exec(location.pathname)?.[1];
        if (routeLocale) language = routeLocale === 'vi' ? 'vi' : 'en';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'light' ? '#f5faf7' : '#07110f';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo-removebg-128.png" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <noscript>
      <img height="1" width="1" style="display:none" alt=""
        src="https://www.facebook.com/tr?id=1441034438213115&amp;ev=PageView&amp;noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
